[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:paddock]
command=paddock --host 0.0.0.0 --port 7233
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:local-review]
command=local-review serve --port 5622
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# local-review only listens on 127.0.0.1, so forward a routable port to it.
# Its Host header check ignores the port, so browse via http://localhost:<host port>.
[program:local-review-proxy]
command=socat TCP-LISTEN:5623,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:5622
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
