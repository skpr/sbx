schemaVersion: "1"
kind: sandbox
name: skpr
displayName: skpr
description: Standardised agentic development environment

network:
  allowedDomains:
    - "api.anthropic.com:443"
    - "claude.com:443"
    - "platform.claude.com:443"
    - "raw.githubusercontent.com:443"

agentContext: |
  You are running inside a herdr-managed sandbox. Multiple coding agents may
  run in parallel panes. Keep changes scoped to the mounted workspace.

sandbox:
  image: ghcr.io/skpr/sbx:latest

  aiFilename: AGENTS.md
  
  entrypoint:
    run: ["herdr"]
